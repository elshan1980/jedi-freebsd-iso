name: Build Jedi ISO
on: [push, workflow_dispatch]

jobs:
  build_iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache FreeBSD Objects
        uses: actions/cache@v4
        with:
          path: /usr/obj
          key: freebsd-obj-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            freebsd-obj-${{ runner.os }}-
            freebsd-obj-

      - name: Build Everything and Make ISO
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: true
          mem: 8192
          prepare: |
            pkg install -y git-lite
            [ -d /usr/src/.git ] || git clone --depth 1 --branch releng/15.0 https://git.freebsd.org/src.git /usr/src
            cp MYLAPTOP /usr/src/sys/amd64/conf/MYLAPTOP
          run: |
            cd /usr/src
            make -j$(sysctl -n hw.ncpu) buildworld
            make -j$(sysctl -n hw.ncpu) buildkernel KERNCONF=MYLAPTOP
            make installkernel KERNCONF=MYLAPTOP DESTDIR=/usr/obj/usr/src/amd64.amd64/release/dist/kernel
            cd release
            make release KERNCONF=MYLAPTOP NOPORTS=yes NOSRC=yes NODOC=yes
            mkdir -p /tmp/artifacts
            cp /usr/obj/usr/src/amd64.amd64/release/disc1.iso /tmp/artifacts/jedi-freebsd-15.0.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-15-Sith-ISO
          path: /tmp/artifacts/jedi-freebsd-15.0.iso
          if-no-files-found: error
