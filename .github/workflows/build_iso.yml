name: Build Sith FreeBSD 15 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build FreeBSD ISO
        uses: vmactions/freebsd-builder@v4
        with:
          release: "15.0"
          # Используем кастомный конфиг MYLAPTOP
          prepare: |
            pkg install -y git-lite
          run: |
            # Установка пакетов для железа Lenovo LOQ
            pkg install -y drm-61-kmod nvidia-driver-550 webcamd cpu-microcode-intel devcpu-data
            
            # Настройка системы на основе твоего файла MYLAPTOP
            cat MYLAPTOP >> /etc/rc.conf
            
            # --- ПРИНУДИТЕЛЬНОЕ СОБЛЮДЕНИЕ ПРАВИЛА СИТХА ---
            # Отключаем SSH и удаляем ключи, чтобы исключить удаленный доступ
            sed -i '' 's/sshd_enable="YES"/sshd_enable="NO"/' /etc/rc.conf
            rm -rf /etc/ssh/ssh_host_*
            
            # Сборка образа (пример стандартной команды release)
            # Примечание: тут должен быть твой специфический скрипт сборки, если он есть
            echo "Building Sith ISO for FreeBSD 15.0..."
            
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sith-FreeBSD-15-ISO
          path: ./*.iso
