name: Build Jedi ISO
on: [push]

jobs:
  build_iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git-lite
            git clone --depth 1 --branch releng/15.0 https://git.freebsd.org/src.git /usr/src
            cp MYLAPTOP /usr/src/sys/amd64/conf/MYLAPTOP
          run: |
            cd /usr/src/release
            # Собираем образ с твоим ядром MYLAPTOP
            make release KERNCONF=MYLAPTOP NOPORTS=yes NOSRC=yes
            # Подготавливаем файл для выдачи
            mv /usr/obj/usr/src/amd64.amd64/release/disc1.iso /tmp/jedi-freebsd-15.0.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jedi-FreeBSD-ISO
          path: /tmp/jedi-freebsd-15.0.iso
