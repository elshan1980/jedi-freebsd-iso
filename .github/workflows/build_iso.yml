name: Project Sith Kit

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Sith Setup Script
        run: |
          # Этот шаг просто упаковывает настройки в один архив
          tar -cvf sith_kit.tar MYLAPTOP
      - uses: actions/upload-artifact@v4
        with:
          name: sith-config
          path: sith_kit.tar
