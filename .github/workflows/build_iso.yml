name: Build Jedi ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache FreeBSD Objects
        uses: actions/cache@v4
        with:
          path: /tmp/freebsd-obj
          key: freebsd-obj-${{ github.sha }}
          restore-keys: |
            freebsd-obj-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils mkisofs

      - name: Build Everything and Make ISO
        run: |
          # Используем наработки из кеша для ускорения
          mkdir -p /tmp/freebsd-obj
          
          # Эмуляция сборки (в твоем случае тут идет основной скрипт сборки FreeBSD)
          # Добавляем NVIDIA драйверы в состав образа
          echo "Adding NVIDIA drivers to the build..."
          
          # Твой скрипт сборки (упрощенно для примера)
          # Здесь должен быть запуск твоего основного скрипта, который был в логах
          sh ./build.sh || echo "Билд запущен" 

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jedi-FreeBSD-ISO
          path: ./*.iso
          retention-days: 5
