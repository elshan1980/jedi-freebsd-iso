name: Build Jedi ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache FreeBSD Objects
        uses: actions/cache@v4
        with:
          path: /usr/obj
          key: freebsd-obj-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            freebsd-obj-${{ runner.os }}-

      - name: Build FreeBSD with NVIDIA
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: true
          mem: 8192
          # Готовим окружение и драйверы
          prepare: |
            pkg install -y git-lite nvidia-driver nvidia-xconfig
            [ -d /usr/src/.git ] || git clone --depth 1 --branch releng/15.0 https://git.freebsd.org/src.git /usr/src
          
          run: |
            # 1. Сборка системы
            cd /usr/src
            make -j$(sysctl -n hw.ncpu) buildworld
            
            # 2. Сборка ядра (GENERIC или MYLAPTOP если файл есть)
            if [ -f /home/runner/work/jedi-freebsd-iso/jedi-freebsd-iso/MYLAPTOP ]; then
              cp /home/runner/work/jedi-freebsd-iso/jedi-freebsd-iso/MYLAPTOP /usr/src/sys/amd64/conf/
              make -j$(sysctl -n hw.ncpu) buildkernel KERNCONF=MYLAPTOP
            else
              make -j$(sysctl -n hw.ncpu) buildkernel KERNCONF=GENERIC
            fi
            
            # 3. Сборка ISO
            cd release
            make release
            
            # 4. Вытаскиваем ISO наружу
            mkdir -p /home/runner/work/artifacts
            find /usr/obj -name "*.iso" -exec cp {} /home/runner/work/artifacts/ \;

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Jedi-FreeBSD-ISO
          path: /home/runner/work/artifacts/*.iso
          if-no-files-found: error
