name: Build Sith FreeBSD 15 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          # Устанавливаем всё необходимое внутри виртуалки
          prepare: |
            pkg install -y git-lite drm-61-kmod nvidia-driver-550 webcamd cpu-microcode-intel devcpu-data
          
          run: |
            # 1. Применяем конфиг из твоего файла MYLAPTOP
            if [ -f "MYLAPTOP" ]; then
              echo "Applying Project Sith configuration..."
              cat MYLAPTOP >> /etc/rc.conf
            fi

            # 2. ПРАВИЛО СИТХА: Выжигаем SSH каленым железом
            # Мы не просто выключаем, мы гарантируем отсутствие доступа
            sysrc sshd_enable="NO"
            sed -i '' 's/sshd_enable="YES"/sshd_enable="NO"/' /etc/rc.conf
            rm -rf /etc/ssh/ssh_host_*
            
            # 3. Сборка ISO (стандартный метод через release)
            echo "Starting Sith ISO generation..."
            cd /usr/src
            # Если исходников нет, подтягиваем их (для 15-й ветки)
            if [ ! -d "/usr/src/release" ]; then
                git clone --depth 1 --branch main https://github.com/freebsd/freebsd-src.git /usr/src
            fi
            cd /usr/src/release
            make release-iso NODOC=yes NOPORTS=yes
            
            # Переносим готовый ISO в рабочую директорию для выгрузки
            cp /usr/obj/usr/src/amd64.amd64/release/*.iso $GITHUB_WORKSPACE/

      - name: Upload Sith ISO
        uses: actions/upload-artifact@v4
        with:
          name: Sith-FreeBSD-15-ISO
          path: ./*.iso
